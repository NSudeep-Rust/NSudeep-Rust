<svg width="100%" height="160" viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="awsCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="cyanGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes activePulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00f2fe); }
    }
    .flow-line {
      stroke: #00f2fe;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      animation: flowPacket 1s linear infinite;
    }
    .aws-node {
      animation: activePulse 2.5s infinite ease-in-out;
    }
    .tier-label {
      font-family: 'Fira Code', monospace;
      font-size: 8px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .service-title {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>

  <!-- Container -->
  <rect width="380" height="160" rx="8" fill="url(#awsCardBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- VPC Boundary Box -->
  <rect x="15" y="15" width="350" height="130" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="#ff9900" stroke-width="1" stroke-dasharray="3 3" />
  <text x="25" y="27" font-family="'Fira Code', monospace" font-size="8" fill="#ff9900" font-weight="bold">AWS VPC (10.0.0.0/16)</text>

  <!-- Flow lines between tiers -->
  <line x1="75" y1="85" x2="140" y2="85" class="flow-line" />
  <line x1="200" y1="85" x2="265" y2="85" class="flow-line" />
  <line x1="170" y1="60" x2="170" y2="40" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />
  <line x1="295" y1="60" x2="295" y2="40" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Tier 1: ALB / Gateway -->
  <g transform="translate(45, 85)" class="aws-node">
    <rect x="-30" y="-22" width="60" height="44" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-16" cy="-10" r="3" fill="#10b981" />
    <text x="0" y="-3" text-anchor="middle" class="service-title">ALB</text>
    <text x="0" y="11" text-anchor="middle" class="tier-label">GATEWAY</text>
  </g>

  <!-- Tier 2: EC2 Compute Autoscaling -->
  <g transform="translate(170, 85)" class="aws-node" style="animation-delay: 0.4s;">
    <rect x="-30" y="-22" width="60" height="44" rx="5" fill="#1e293b" stroke="#ff9900" stroke-width="1.5" />
    <circle cx="-16" cy="-10" r="3" fill="#10b981" />
    <text x="0" y="-3" text-anchor="middle" class="service-title">EC2</text>
    <text x="0" y="11" text-anchor="middle" class="tier-label">COMPUTE</text>
  </g>

  <!-- Tier 3: RDS Aurora Multi-AZ -->
  <g transform="translate(295, 85)" class="aws-node" style="animation-delay: 0.8s;">
    <rect x="-30" y="-22" width="60" height="44" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-16" cy="-10" r="3" fill="#10b981" />
    <text x="0" y="-3" text-anchor="middle" class="service-title">RDS</text>
    <text x="0" y="11" text-anchor="middle" class="tier-label">DATABASE</text>
  </g>

  <!-- Top Utilities: IAM Security & S3 Bucket -->
  <g transform="translate(170, 35)">
    <rect x="-30" y="-10" width="60" height="20" rx="3" fill="#0f172a" stroke="#ff9900" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" fill="#ffb703" font-weight="bold">IAM / KMS</text>
  </g>

  <g transform="translate(295, 35)">
    <rect x="-30" y="-10" width="60" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" fill="#6ee7b7" font-weight="bold">S3 BUCKET</text>
  </g>
</svg>
