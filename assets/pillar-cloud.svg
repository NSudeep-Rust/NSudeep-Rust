<svg width="100%" height="150" viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140303" />
      <stop offset="100%" stop-color="#050000" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    .node { animation: pulseNode 2.5s infinite ease-in-out; transform-origin: center; }
    .packet-line { stroke-dasharray: 6 6; animation: packetFlow 1.2s linear infinite; }
  </style>
  <rect width="380" height="150" rx="8" fill="url(#cloudGrad)" stroke="#4a0808" stroke-width="1.2" />

  <!-- Cloud Nodes & Network Architecture -->
  <line x1="80" y1="75" x2="190" y2="45" stroke="#ff2800" stroke-width="1.5" class="packet-line" opacity="0.8" />
  <line x1="80" y1="75" x2="190" y2="105" stroke="#ff2800" stroke-width="1.5" class="packet-line" opacity="0.8" />
  <line x1="190" y1="45" x2="300" y2="75" stroke="#ff2800" stroke-width="1.5" class="packet-line" opacity="0.8" />
  <line x1="190" y1="105" x2="300" y2="75" stroke="#ff2800" stroke-width="1.5" class="packet-line" opacity="0.8" />

  <!-- Node 1: Multi-Region VPC -->
  <g transform="translate(80, 75)">
    <circle r="22" fill="#240505" stroke="#ff2800" stroke-width="2" filter="url(#pGlow)" class="node" />
    <text text-anchor="middle" dy="4" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">VPC</text>
  </g>

  <!-- Node 2: IAM Security Engine -->
  <g transform="translate(190, 45)">
    <circle r="20" fill="#240505" stroke="#ff2800" stroke-width="1.8" filter="url(#pGlow)" class="node" style="animation-delay: 0.5s;" />
    <text text-anchor="middle" dy="4" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">IAM</text>
  </g>

  <!-- Node 3: S3 / RDS Storage -->
  <g transform="translate(190, 105)">
    <circle r="20" fill="#240505" stroke="#ff2800" stroke-width="1.8" filter="url(#pGlow)" class="node" style="animation-delay: 1s;" />
    <text text-anchor="middle" dy="4" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">S3/RDS</text>
  </g>

  <!-- Node 4: Threat Auto-Remedy -->
  <g transform="translate(300, 75)">
    <circle r="22" fill="#240505" stroke="#00e676" stroke-width="2" class="node" style="animation-delay: 1.5s;" />
    <text text-anchor="middle" dy="4" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">SHIELD</text>
  </g>
</svg>
