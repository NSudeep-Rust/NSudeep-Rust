<svg width="100%" height="150" viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140303" />
      <stop offset="100%" stop-color="#050000" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes synapsePulse {
      0%, 100% { opacity: 0.3; stroke-width: 1; }
      50% { opacity: 1; stroke-width: 2.2; stroke: #ff2800; }
    }
    @keyframes neuronGlow {
      0%, 100% { r: 6; fill: #ff2800; }
      50% { r: 8.5; fill: #ffffff; }
    }
    .synapse { stroke: #660a0a; animation: synapsePulse 2s infinite ease-in-out; }
    .neuron { animation: neuronGlow 2s infinite ease-in-out; }
  </style>
  <rect width="380" height="150" rx="8" fill="url(#aiGrad)" stroke="#4a0808" stroke-width="1.2" />

  <!-- Synaptic Connections -->
  <line x1="60" y1="45" x2="130" y2="35" class="synapse" />
  <line x1="60" y1="45" x2="130" y2="75" class="synapse" style="animation-delay: 0.3s;" />
  <line x1="60" y1="105" x2="130" y2="75" class="synapse" style="animation-delay: 0.6s;" />
  <line x1="60" y1="105" x2="130" y2="115" class="synapse" style="animation-delay: 0.9s;" />

  <line x1="130" y1="35" x2="250" y2="55" class="synapse" style="animation-delay: 1.2s;" />
  <line x1="130" y1="75" x2="250" y2="55" class="synapse" style="animation-delay: 0.4s;" />
  <line x1="130" y1="75" x2="250" y2="95" class="synapse" style="animation-delay: 0.8s;" />
  <line x1="130" y1="115" x2="250" y2="95" class="synapse" style="animation-delay: 1.5s;" />

  <line x1="250" y1="55" x2="320" y2="75" class="synapse" style="animation-delay: 0.7s;" />
  <line x1="250" y1="95" x2="320" y2="75" class="synapse" style="animation-delay: 1.1s;" />

  <!-- Layer 1: Ollama Local Models -->
  <circle cx="60" cy="45" class="neuron" filter="url(#aiGlow)" />
  <circle cx="60" cy="105" class="neuron" style="animation-delay: 0.5s;" filter="url(#aiGlow)" />
  <text x="60" y="25" text-anchor="middle" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">OLLAMA</text>

  <!-- Layer 2: Transformers & Embeddings -->
  <circle cx="130" cy="35" class="neuron" style="animation-delay: 0.8s;" filter="url(#aiGlow)" />
  <circle cx="130" cy="75" class="neuron" style="animation-delay: 0.3s;" filter="url(#aiGlow)" />
  <circle cx="130" cy="115" class="neuron" style="animation-delay: 1s;" filter="url(#aiGlow)" />
  <text x="130" y="137" text-anchor="middle" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">TRANSFORMERS</text>

  <!-- Layer 3: Hugging Face Models -->
  <circle cx="250" cy="55" class="neuron" style="animation-delay: 0.4s;" filter="url(#aiGlow)" />
  <circle cx="250" cy="95" class="neuron" style="animation-delay: 1.2s;" filter="url(#aiGlow)" />
  <text x="250" y="25" text-anchor="middle" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">HUGGING FACE</text>

  <!-- Layer 4: Inference Engine -->
  <circle cx="320" cy="75" class="neuron" style="animation-delay: 0.9s; fill: #00e676;" filter="url(#aiGlow)" />
  <text x="320" y="105" text-anchor="middle" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="8">INFERENCE</text>
</svg>
