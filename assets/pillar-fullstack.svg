<svg width="100%" height="150" viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140303" />
      <stop offset="100%" stop-color="#050000" />
    </linearGradient>
    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes burstWs {
      0% { opacity: 0.2; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.2; transform: scale(0.95); }
    }
    @keyframes dataPulse {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .ws-hub { animation: burstWs 2s infinite ease-in-out; transform-origin: 190px 75px; }
    .data-flow { stroke-dasharray: 5 4; animation: dataPulse 1s linear infinite; }
  </style>
  <rect width="380" height="150" rx="8" fill="url(#fsGrad)" stroke="#4a0808" stroke-width="1.2" />

  <!-- Data Flow Paths -->
  <line x1="80" y1="75" x2="190" y2="75" stroke="#ff2800" stroke-width="1.8" class="data-flow" />
  <line x1="190" y1="75" x2="300" y2="75" stroke="#ff2800" stroke-width="1.8" class="data-flow" />

  <!-- Frontend Node: React -->
  <g transform="translate(80, 75)">
    <rect x="-40" y="-28" width="80" height="56" rx="6" fill="#1c0505" stroke="#ff2800" stroke-width="1.5" filter="url(#fsGlow)" />
    <text text-anchor="middle" dy="-6" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">REACT</text>
    <text text-anchor="middle" dy="10" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">UI / SPAs</text>
  </g>

  <!-- Central Hub: FastAPI & WebSockets -->
  <g transform="translate(190, 75)" class="ws-hub">
    <circle r="30" fill="#290505" stroke="#ff2800" stroke-width="2" filter="url(#fsGlow)" />
    <text text-anchor="middle" dy="-6" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">FASTAPI</text>
    <text text-anchor="middle" dy="9" fill="#00e676" font-family="'Fira Code', monospace" font-size="8">WS STREAM</text>
  </g>

  <!-- Backend & DB: MySQL / SQLite -->
  <g transform="translate(300, 75)">
    <rect x="-40" y="-28" width="80" height="56" rx="6" fill="#1c0505" stroke="#ff2800" stroke-width="1.5" filter="url(#fsGlow)" />
    <text text-anchor="middle" dy="-6" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">MYSQL</text>
    <text text-anchor="middle" dy="10" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">PHP / SQL</text>
  </g>
</svg>
