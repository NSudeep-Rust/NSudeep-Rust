<svg width="100%" height="160" viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fsCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <style>
    @keyframes fsDataFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes fsPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 5px #61dafb); }
    }
    .fs-flow {
      stroke: #61dafb;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      animation: fsDataFlow 1.1s linear infinite;
    }
    .fs-box {
      animation: fsPulse 2.5s infinite ease-in-out;
    }
    .fs-sub {
      font-family: 'Fira Code', monospace;
      font-size: 8px;
      fill: #94a3b8;
    }
    .fs-header {
      font-family: 'Fira Code', monospace;
      font-size: 9px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>

  <!-- Container -->
  <rect width="380" height="160" rx="8" fill="url(#fsCardBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Flow Lines -->
  <line x1="85" y1="80" x2="145" y2="80" class="fs-flow" />
  <line x1="235" y1="80" x2="295" y2="80" class="fs-flow" />
  <line x1="190" y1="45" x2="190" y2="25" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Tier 1: Frontend SPA -->
  <g transform="translate(50, 80)" class="fs-box">
    <rect x="-35" y="-30" width="70" height="60" rx="6" fill="#0f172a" stroke="#61dafb" stroke-width="1.5" />
    <circle cx="-20" cy="-17" r="3" fill="#61dafb" />
    <text x="0" y="-8" text-anchor="middle" class="fs-header" fill="#61dafb">REACT</text>
    <text x="0" y="7" text-anchor="middle" class="fs-sub">SPAs / UI</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Fira Code', monospace" font-size="7" fill="#64748b">BOOTSTRAP</text>
  </g>

  <!-- Tier 2: API Gateway & WebSocket Hub -->
  <g transform="translate(190, 80)" class="fs-box" style="animation-delay: 0.4s;">
    <rect x="-45" y="-30" width="90" height="60" rx="6" fill="#0f172a" stroke="#009688" stroke-width="1.8" />
    <circle cx="-30" cy="-17" r="3" fill="#10b981" />
    <text x="0" y="-8" text-anchor="middle" class="fs-header" fill="#34d399">FASTAPI</text>
    <text x="0" y="7" text-anchor="middle" class="fs-sub">ASYNC REST</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Fira Code', monospace" font-size="7" fill="#00f2fe">WEBSOCKETS</text>
  </g>

  <!-- Top Microservice: PHP / Python Backend -->
  <g transform="translate(190, 20)">
    <rect x="-45" y="-9" width="90" height="18" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="0" y="3.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="7.5" fill="#93c5fd" font-weight="bold">PHP &amp; PYTHON CORE</text>
  </g>

  <!-- Tier 3: Database & Storage -->
  <g transform="translate(330, 80)" class="fs-box" style="animation-delay: 0.8s;">
    <rect x="-35" y="-30" width="70" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-20" cy="-17" r="3" fill="#38bdf8" />
    <text x="0" y="-8" text-anchor="middle" class="fs-header" fill="#38bdf8">MYSQL</text>
    <text x="0" y="7" text-anchor="middle" class="fs-sub">RELATIONAL</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Fira Code', monospace" font-size="7" fill="#64748b">SQLITE / ORM</text>
  </g>
</svg>
