<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">About Sudeep</title><desc id="desc">Sudeep is pursuing an MCA at Karnatak University, Dharwad. He builds cloud security tools, deployment pipelines and full-stack applications. AWS CloudShield combines scanning, IAM analysis, dry-run remediation and rollback. The illustration shows a terminal, checks and cloud deployment.</desc>
<style>@media(prefers-reduced-motion:reduce){.animated{display:none}}</style>
<rect width="900" height="500" fill="#0a1317"/>
<path d="M30 32h12m-6-6v12" fill="none" stroke="#d9b98a" stroke-width="2"/>
<text x="56" y="39" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#d9b98a" font-weight="700" letter-spacing="2.5">ABOUT ME</text><line x1="24" y1="55" x2="876" y2="55" stroke="#314147"/><text x="36" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#f3ead8" font-weight="700" >Hey, I&#x27;m Sudeep!</text><text x="36" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >I&#x27;m pursuing my MCA at Karnatak University, Dharwad,</text><text x="36" y="168" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >and I build cloud security tools, deployment pipelines,</text><text x="36" y="191" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >and full-stack applications.</text><text x="36" y="237" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >My main project, AWS CloudShield, combines security</text><text x="36" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >scanning, IAM risk analysis, dry-run remediation, and</text><text x="36" y="283" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >rollback in a Python, FastAPI, React &amp; Electron app.</text><text x="36" y="329" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >I also explore local AI with Ollama and Hugging Face.</text><text x="36" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#b9b8ac" >Away from code: RDR2, The Last of Us, F1, and football.</text><line x1="36" y1="420" x2="864" y2="420" stroke="#314147"/><text x="36" y="456" font-family="'Courier New', monospace" font-size="11" fill="#22c9cf" font-weight="700" letter-spacing="1">CLOUD &amp; DEVOPS</text><text x="253" y="456" font-family="'Courier New', monospace" font-size="11" fill="#d9b98a" font-weight="700" letter-spacing="1">FULL STACK</text><text x="438" y="456" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" font-weight="700" letter-spacing="1">LOCAL AI</text><g transform="translate(552 105)"><text x="150" y="4" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" text-anchor="middle" letter-spacing="1">FROM CODE TO CLOUD</text><path d="M76 160 V124 Q76 114 86 114 H220 V90" fill="none" stroke="#314147" stroke-width="2"/><path d="M196 67h58c25 0 28-35 5-40-5-23-36-27-49-10-21-5-37 11-31 29-12 8-7 21 17 21Z" fill="#102127" stroke="#22c9cf" stroke-width="1.6"/><path d="M216 28l14 5v11c0 10-7 16-14 20-7-4-14-10-14-20V33Z" fill="#0a1317" stroke="#d9b98a" stroke-width="1.3"/><path d="M209 44l5 5 10-11" fill="none" stroke="#d9b98a" stroke-width="1.7"/><rect x="12" y="138" width="161" height="103" rx="2" fill="#102127" stroke="#b9b8ac" stroke-width="1.5"/><rect x="20" y="146" width="145" height="87" fill="#0a1317"/><text x="30" y="167" font-family="'Courier New', monospace" font-size="12" fill="#f3ead8" >$ git push</text><text x="30" y="190" font-family="'Courier New', monospace" font-size="11" fill="#22c9cf" >✓ checks passed</text><text x="30" y="212" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" >deploy_</text><path d="M2 242h181l12 8v5H-10v-5Z" fill="#102127" stroke="#b9b8ac" stroke-width="1.3"/><circle class="animated" cx="76" cy="160" r="3" fill="#22c9cf"><animate attributeName="cx" values="76;76;220;220;220" keyTimes="0;.23;.7;.84;1" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="160;114;114;90;90" keyTimes="0;.23;.7;.84;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.8;.9;1" dur="8s" repeatCount="indefinite"/></circle><text x="229" y="167" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" >CODE</text><text x="229" y="193" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" >CHECK</text><text x="229" y="219" font-family="'Courier New', monospace" font-size="11" fill="#b9b8ac" >DEPLOY</text><circle cx="215" cy="163" r="3" fill="#314147"/><circle class="animated" cx="215" cy="163" r="3" fill="#22c9cf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.10;.86;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="215" cy="189" r="3" fill="#314147"/><circle class="animated" cx="215" cy="189" r="3" fill="#22c9cf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.31;.86;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="215" cy="215" r="3" fill="#314147"/><circle class="animated" cx="215" cy="215" r="3" fill="#22c9cf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.52;.86;1" dur="8s" repeatCount="indefinite"/></circle></g></svg>
