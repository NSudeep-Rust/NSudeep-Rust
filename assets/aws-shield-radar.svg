<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0202" />
      <stop offset="50%" stop-color="#140303" />
      <stop offset="100%" stop-color="#050000" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2800" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff2800" stop-opacity="0" />
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseThreat {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes blinkText {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .scanner-sweep {
      transform-origin: 400px 100px;
      animation: sweep 4s linear infinite;
    }
    .threat-node {
      animation: pulseThreat 2s ease-in-out infinite;
    }
    .telemetry-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #ff4d4d;
      letter-spacing: 1px;
    }
    .telemetry-val {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="796" height="196" rx="12" fill="url(#radarBg)" stroke="#4a0808" stroke-width="1.5" />

  <!-- Left Telemetry Panel -->
  <g transform="translate(30, 35)">
    <text x="0" y="0" class="telemetry-text">SYSTEM DEFENSE ENGINE</text>
    <text x="0" y="20" class="telemetry-val">AWS CLOUDSHIELD v2.4</text>
    
    <text x="0" y="55" class="telemetry-text">SCAN COVERAGE</text>
    <text x="0" y="75" class="telemetry-val">9 AWS REGIONS ACTIVE</text>
    
    <text x="0" y="110" class="telemetry-text">SCAN FREQUENCY</text>
    <text x="0" y="130" class="telemetry-val">~40s FULL AUDIT</text>
  </g>

  <!-- Radar Grid Circles (Center at 400, 100) -->
  <g>
    <circle cx="400" cy="100" r="85" fill="none" stroke="#3d0a0a" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="400" cy="100" r="60" fill="none" stroke="#660d0d" stroke-width="1" />
    <circle cx="400" cy="100" r="35" fill="none" stroke="#991414" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="400" cy="100" r="10" fill="#ff2800" opacity="0.4" filter="url(#redGlow)" />
    
    <!-- Crosshairs -->
    <line x1="305" y1="100" x2="495" y2="100" stroke="#3d0a0a" stroke-width="1" />
    <line x1="400" y1="10" x2="400" y2="190" stroke="#3d0a0a" stroke-width="1" />

    <!-- Rotating Radar Scanner Beam -->
    <g class="scanner-sweep">
      <path d="M 400 100 L 485 100 A 85 85 0 0 0 440 25 Z" fill="url(#sweepGrad)" opacity="0.5" />
      <line x1="400" y1="100" x2="485" y2="100" stroke="#ff2800" stroke-width="2" filter="url(#redGlow)" />
    </g>

    <!-- Radar Threat Targets -->
    <circle cx="435" cy="65" r="4" fill="#ff2800" class="threat-node" filter="url(#redGlow)" />
    <text x="444" y="68" font-family="'Fira Code', monospace" font-size="9" fill="#ff8080">IAM-01</text>

    <circle cx="360" cy="130" r="4" fill="#ff2800" class="threat-node" style="animation-delay: 0.6s;" filter="url(#redGlow)" />
    <text x="368" y="133" font-family="'Fira Code', monospace" font-size="9" fill="#ff8080">S3-LEAK</text>

    <circle cx="450" cy="120" r="4" fill="#00e676" class="threat-node" style="animation-delay: 1.2s;" />
    <text x="458" y="123" font-family="'Fira Code', monospace" font-size="9" fill="#a7f3d0">VPC-OK</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(600, 35)">
    <text x="0" y="0" class="telemetry-text">SECURITY CONTROLS</text>
    <text x="0" y="20" class="telemetry-val">52+ ACTIVE CHECKS</text>
    
    <text x="0" y="55" class="telemetry-text">THREAT DETECTIONS</text>
    <text x="0" y="75" class="telemetry-val" fill="#ff4d4d">195+ LIVE VECTORS</text>
    
    <text x="0" y="110" class="telemetry-text">COMPLIANCE SUITE</text>
    <text x="0" y="130" class="telemetry-val">CIS / PCI DSS / NIST</text>
  </g>
</svg>
