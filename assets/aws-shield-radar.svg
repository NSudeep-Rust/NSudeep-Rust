<svg width="100%" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="socBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="socSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes sweep360 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blipPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .radar-sweep-beam {
      transform-origin: 400px 100px;
      animation: sweep360 3.5s linear infinite;
    }
    .blip {
      animation: blipPulse 1.8s ease-in-out infinite;
      transform-origin: center;
    }
    .soc-label {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .soc-value {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      fill: #ffffff;
    }
  </style>

  <!-- Base Panel -->
  <rect x="2" y="2" width="796" height="196" rx="10" fill="url(#socBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Left Telemetry Panel -->
  <g transform="translate(30, 35)">
    <text x="0" y="0" class="soc-label">DEFENSE ENGINE</text>
    <text x="0" y="20" class="soc-value" fill="#00f2fe">AWS CLOUDSHIELD v2.4</text>
    
    <text x="0" y="55" class="soc-label">GLOBAL FOOTPRINT</text>
    <text x="0" y="75" class="soc-value">9 AWS REGIONS ACTIVE</text>
    
    <text x="0" y="110" class="soc-label">AUDIT VELOCITY</text>
    <text x="0" y="130" class="soc-value" fill="#34d399">~40s FULL ACCOUNT SCAN</text>
  </g>

  <!-- Central Radar Display (Center: 400, 100) -->
  <g>
    <!-- Range Rings -->
    <circle cx="400" cy="100" r="85" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3 4" />
    <circle cx="400" cy="100" r="60" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.6" />
    <circle cx="400" cy="100" r="35" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="400" cy="100" r="8" fill="#00f2fe" opacity="0.6" filter="url(#cyanGlow)" />
    
    <!-- Crosshairs -->
    <line x1="305" y1="100" x2="495" y2="100" stroke="#1e293b" stroke-width="1" />
    <line x1="400" y1="10" x2="400" y2="190" stroke="#1e293b" stroke-width="1" />

    <!-- Rotating Radar Beam -->
    <g class="radar-sweep-beam">
      <path d="M 400 100 L 485 100 A 85 85 0 0 0 440 25 Z" fill="url(#socSweep)" opacity="0.45" />
      <line x1="400" y1="100" x2="485" y2="100" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="435" cy="65" r="4" fill="#f59e0b" class="blip" filter="url(#cyanGlow)" />
    <text x="444" y="68" font-family="'Fira Code', monospace" font-size="9" fill="#fbbf24">IAM-RISK</text>

    <circle cx="355" cy="125" r="4" fill="#38bdf8" class="blip" style="animation-delay: 0.6s;" />
    <text x="363" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#7dd3fc">S3-AUDIT</text>

    <circle cx="450" cy="120" r="4" fill="#10b981" class="blip" style="animation-delay: 1.2s;" />
    <text x="458" y="123" font-family="'Fira Code', monospace" font-size="9" fill="#6ee7b7">VPC-PEER</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(600, 35)">
    <text x="0" y="0" class="soc-label">SECURITY CONTROLS</text>
    <text x="0" y="20" class="soc-value" fill="#38bdf8">52+ COMPLIANCE CHECKS</text>
    
    <text x="0" y="55" class="soc-label">THREAT STREAM</text>
    <text x="0" y="75" class="soc-value" fill="#fbbf24">195+ LIVE WS VECTORS</text>
    
    <text x="0" y="110" class="soc-label">COMPLIANCE SUITE</text>
    <text x="0" y="130" class="soc-value" fill="#34d399">CIS / PCI DSS / NIST CSF</text>
  </g>
</svg>
