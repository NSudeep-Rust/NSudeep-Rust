<rect width="900" height="103" fill="#0d1117"/><line x1="0" y1="3" x2="900" y2="3" stroke="#293b4c"/><text x="450" y="44" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#e6edf3" text-anchor="middle" font-style="italic">There is always another horizon.</text><text x="450" y="77" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#9bafc1" text-anchor="middle" letter-spacing="2">LET’S BUILD SOMETHING THAT LASTS.</text>
</svg>
