<svg width="100%" height="150" viewBox="0 0 380 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140303" />
      <stop offset="100%" stop-color="#050000" />
    </linearGradient>
    <filter id="dGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes pipelineProgress {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes stageActive {
      0%, 100% { fill: #240505; stroke: #ff2800; }
      50% { fill: #4d0000; stroke: #ff6644; }
    }
    .pipe-track { stroke-dasharray: 8 6; animation: pipelineProgress 1.4s linear infinite; }
    .stage-box { animation: stageActive 2s infinite ease-in-out; }
  </style>
  <rect width="380" height="150" rx="8" fill="url(#devopsGrad)" stroke="#4a0808" stroke-width="1.2" />

  <!-- Pipeline Connector Lines -->
  <line x1="55" y1="75" x2="140" y2="75" stroke="#ff2800" stroke-width="2" class="pipe-track" />
  <line x1="140" y1="75" x2="230" y2="75" stroke="#ff2800" stroke-width="2" class="pipe-track" />
  <line x1="230" y1="75" x2="320" y2="75" stroke="#ff2800" stroke-width="2" class="pipe-track" />

  <!-- Stage 1: Commit -->
  <g transform="translate(55, 75)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" class="stage-box" stroke-width="1.5" filter="url(#dGlow)" />
    <text text-anchor="middle" dy="-3" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">GIT</text>
    <text text-anchor="middle" dy="12" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">COMMIT</text>
  </g>

  <!-- Stage 2: Actions Test -->
  <g transform="translate(140, 75)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" class="stage-box" style="animation-delay: 0.5s;" stroke-width="1.5" filter="url(#dGlow)" />
    <text text-anchor="middle" dy="-3" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">ACTIONS</text>
    <text text-anchor="middle" dy="12" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">CI RUN</text>
  </g>

  <!-- Stage 3: Multi-Platform Build -->
  <g transform="translate(230, 75)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" class="stage-box" style="animation-delay: 1s;" stroke-width="1.5" filter="url(#dGlow)" />
    <text text-anchor="middle" dy="-3" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">BUILD</text>
    <text text-anchor="middle" dy="12" fill="#ff8080" font-family="'Fira Code', monospace" font-size="8">LINUX/WIN</text>
  </g>

  <!-- Stage 4: Deploy Live -->
  <g transform="translate(320, 75)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" fill="#042010" stroke="#00e676" stroke-width="1.8" />
    <text text-anchor="middle" dy="-3" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">DEPLOY</text>
    <text text-anchor="middle" dy="12" fill="#86efac" font-family="'Fira Code', monospace" font-size="8">LIVE ✔</text>
  </g>
</svg>
